<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>मतदार स्लिप – शिव मल्हार विकास पॅनल, चंदनपुरी</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ef;--surface:#ffffff;--surface2:#fff3e2;--ink:#2a1f14;--muted:#7a6a58;--line:#f0dfc8;
  --brand:#e8730c;--brand2:#b8400a;--accent:#1b7a3d;--danger:#c62828;--warn:#f59e0b;
  --shadow:0 8px 28px rgba(140,70,0,.14);--chip:#fff1dc;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#17110b;--surface:#231a12;--surface2:#2d2218;--ink:#f7ecdc;--muted:#bba78f;--line:#3d2f22;--shadow:0 8px 28px rgba(0,0,0,.55);--chip:#33261a}
}
:root[data-theme="dark"]{--bg:#17110b;--surface:#231a12;--surface2:#2d2218;--ink:#f7ecdc;--muted:#bba78f;--line:#3d2f22;--shadow:0 8px 28px rgba(0,0,0,.55);--chip:#33261a}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta","Noto Sans Devanagari","Mangal","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.4;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}

/* ---------- animations ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.92) translateY(8px)}60%{transform:scale(1.02)}100%{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes blob{50%{transform:translate(34px,-24px) scale(1.18)}}
@keyframes shimmer{to{background-position:220% 0}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(232,115,12,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(120deg,#f59e0b,#e8590c 55%,#b8400a);background-size:200% 200%;animation:shimmer 14s linear infinite;padding:18px 20px 26px;border-radius:0 0 28px 28px;box-shadow:var(--shadow)}
.blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.35;animation:blob 9s ease-in-out infinite}
.b1{width:200px;height:200px;background:#fff;top:-60px;left:-40px}
.b2{width:260px;height:260px;background:#ffd166;right:-70px;top:-30px;animation-delay:-3s}
.b3{width:160px;height:160px;background:#7a1f00;bottom:-70px;left:40%;animation-delay:-6s}
.hero-in{position:relative;max-width:1150px;margin:0 auto;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
@keyframes leaderIn{0%{opacity:0;transform:translateY(26px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@keyframes haloPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.45),0 10px 30px rgba(0,0,0,.3)}50%{box-shadow:0 0 0 14px rgba(255,255,255,0),0 14px 36px rgba(0,0,0,.35)}}
.leaders{position:relative;max-width:1150px;margin:4px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:22px;padding:6px 16px 2px}
.ldr{position:relative;flex:none;width:150px;text-align:center;animation:leaderIn .7s cubic-bezier(.2,.8,.2,1) both}
.ldr:nth-child(2){animation-delay:.12s}
.ldr-ring{position:relative;width:132px;height:132px;margin:0 auto 10px;border-radius:50%}
.ldr-ring:before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,#fff,rgba(255,255,255,.1) 30%,#fff 55%,rgba(255,255,255,.1) 85%,#fff);animation:ringSpin 7s linear infinite}
.ldr-ring .inner{position:absolute;inset:5px;border-radius:50%;overflow:hidden;background:#fff;animation:haloPulse 3.2s ease-in-out infinite}
.ldr-ring img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.ldr:hover .ldr-ring img{transform:scale(1.08) rotate(-1deg)}
.ldr-name{color:#fff;font-weight:800;font-size:1.05rem;text-shadow:0 2px 8px rgba(0,0,0,.35);line-height:1.2}
.ldr-title{color:#ffe9c7;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px;opacity:.95}
@media(max-width:860px){.ldr{width:120px}.ldr-ring{width:108px;height:108px}.ldr-name{font-size:.92rem}}
.leaders.solo{gap:0;margin-top:2px}
.ldr.big{width:200px}
.ldr.big .ldr-ring{width:168px;height:168px;margin-bottom:12px}
.ldr.big .ldr-title{display:inline-block;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.4);padding:4px 16px;border-radius:999px;font-size:.8rem;margin-bottom:10px}
.ldr.big .ldr-name{font-size:1.3rem}
@media(max-width:860px){.ldr.big{width:160px}.ldr.big .ldr-ring{width:136px;height:136px}.ldr.big .ldr-name{font-size:1.08rem}}
.symwrap{position:relative;width:86px;height:86px;flex:none;animation:float 5s ease-in-out infinite}
.symwrap:before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#fff,transparent 30%,#fff 60%,transparent);animation:spin 6s linear infinite;opacity:.8}
.symwrap img{position:relative;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:50%;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.ht{flex:1;min-width:220px}
.pn{font-size:1.65rem;font-weight:800;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.vl{opacity:.95;font-size:.98rem;margin-top:3px}
.pk{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);padding:6px 16px 6px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.4)}
.pk img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#fff}
.pk small{display:block;font-size:.75rem;opacity:.9;line-height:1}
.pk b{font-size:1.02rem}
.tools{display:flex;gap:6px;margin-left:auto}
.tb{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:700;transition:.2s}
.tb:hover{background:rgba(255,255,255,.4);transform:translateY(-1px)}
.tb.on{background:#fff;color:var(--brand2)}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:1150px;margin:8px auto 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;cursor:pointer;padding:10px 18px;border-radius:999px;background:var(--surface);color:var(--muted);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.25s}
.tab:hover{transform:translateY(-2px);color:var(--brand2)}
.tab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(232,115,12,.4)}
main{max-width:1150px;margin:0 auto;padding:6px 16px 60px}
.view{animation:fadeUp .4s ease both}
.card{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
h3{margin:0 0 12px;font-size:1.15rem}
.note{font-size:.86rem;color:var(--muted)}

/* ---------- controls ---------- */
.btn{border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-weight:700;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;transition:.2s;box-shadow:0 4px 12px rgba(232,115,12,.3)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(232,115,12,.4)}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--chip);color:var(--brand2);box-shadow:none}
.btn.green{background:linear-gradient(135deg,#2e9e57,var(--accent))}
.btn.red{background:linear-gradient(135deg,#e04b4b,var(--danger))}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:9px}
.in,select.in{padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);width:100%;outline:none;transition:.2s}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(232,115,12,.15)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;transition:.2s}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sbox{position:relative;flex:1;min-width:230px}
.sbox input{width:100%;padding:16px 92px 16px 48px;font-size:1.2rem;border:2px solid var(--brand);border-radius:18px;background:var(--surface);outline:none;box-shadow:0 6px 20px rgba(232,115,12,.15);transition:.2s}
.sbox input:focus{box-shadow:0 0 0 5px rgba(232,115,12,.2),0 6px 20px rgba(232,115,12,.2)}
.sbox .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1.3rem;opacity:.7}
.sbox .rt{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
.sbox .rt button{border:0;background:transparent;font-size:1.25rem;cursor:pointer;padding:6px 8px;border-radius:10px}
.sbox .rt button:hover{background:var(--chip)}
.srow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.srow select{width:auto;min-width:140px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--surface);border-radius:18px;padding:12px 16px;border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .5s both;animation-delay:calc(var(--i,0)*80ms)}
.stat b{display:block;font-size:1.8rem;line-height:1.1;background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.82rem;color:var(--muted)}

/* ---------- results ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}.pn{font-size:1.3rem}.tools{margin-left:0}}
.list{display:flex;flex-direction:column;gap:8px;max-height:640px;overflow:auto;padding:2px 4px 2px 2px}
.item{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;background:var(--surface);transition:.2s;animation:fadeUp .35s both;animation-delay:calc(min(var(--i,0),12)*35ms)}
.item:hover{transform:translateX(4px);border-color:var(--brand);box-shadow:0 4px 14px rgba(232,115,12,.15)}
.item.sel{border-color:var(--brand);background:var(--surface2)}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.15rem;background:hsl(var(--h,25) 70% 45%)}
.item .mid{flex:1;min-width:0}
.item .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:.74rem;padding:3px 10px;border-radius:999px;background:#dcfce7;color:#166534;white-space:nowrap;font-weight:700}
.tag.w{background:#ffedd5;color:#9a3412}
.empty{color:var(--muted);padding:34px 16px;text-align:center;border:2px dashed var(--line);border-radius:18px}
.empty .big{font-size:2.4rem;display:block;animation:float 4s ease-in-out infinite}
mark{background:#fde68a;color:#000;padding:0 2px;border-radius:3px}
.fam{margin-top:16px;padding:14px;background:linear-gradient(135deg,rgba(46,158,87,.12),rgba(46,158,87,.04));border:1px solid rgba(46,158,87,.3);border-radius:18px;animation:fadeUp .5s both}
.fam h4{margin:0 0 10px;color:var(--accent)}

/* ---------- tables & forms ---------- */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:560px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--surface2);position:sticky;top:0;z-index:1;font-size:.82rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--surface2)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);font-weight:600}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
details.acc summary{padding:14px 18px;cursor:pointer;font-weight:800;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.acc summary::after{content:"＋";color:var(--brand);font-size:1.3rem;transition:.3s}
details.acc[open] summary::after{transform:rotate(45deg)}
details.acc .ab{padding:0 18px 18px;animation:fadeUp .3s both}
.imgrow{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:12px}
.imgbox{display:flex;align-items:center;gap:12px}
.imgbox img{width:76px;height:76px;object-fit:cover;border-radius:50%;border:2px solid var(--line);background:#fff}
.switch{position:relative;width:46px;height:26px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:#cbd5e1;border-radius:99px;cursor:pointer;transition:.25s}
.switch i:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i:before{transform:translateX(20px)}

/* ---------- dashboard ---------- */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.ring{position:relative;width:170px;height:170px;margin:4px auto 8px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:url(#rg);transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring .ct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:2rem}
.ring .ct small{display:block;font-size:.75rem;font-weight:500;color:var(--muted)}
.brow{margin:9px 0}
.brow .bl{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:3px}
.bar{height:11px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--warn),var(--brand2));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar i.g{background:linear-gradient(90deg,#4cc38a,var(--accent))}
.cols{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:10px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem;color:var(--muted)}
.col i{display:block;width:100%;max-width:34px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--brand),var(--brand2));height:0;transition:height 1s cubic-bezier(.2,.8,.2,1)}

/* ---------- lock / modal / toast / fx ---------- */
#lock{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(140deg,#f59e0b,#e8590c 50%,#7a1f00);overflow:auto}
#lock.on{display:grid}
.lbox{width:100%;max-width:340px;text-align:center;color:#fff;animation:pop .6s both}
.lbox .symwrap{margin:0 auto 12px}
.lbox h2{margin:0;font-size:1.5rem;line-height:1.2}
.lbox p{margin:6px 0 14px;opacity:.92}
.dots{display:flex;justify-content:center;gap:12px;margin:10px 0 18px;height:16px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;transition:.15s}
.dots i.f{background:#fff;transform:scale(1.1)}
.dots.err{animation:shake .45s}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{border:0;border-radius:18px;padding:14px 0;font-size:1.5rem;font-weight:700;background:rgba(255,255,255,.22);color:#fff;cursor:pointer;transition:.12s;backdrop-filter:blur(4px)}
.keys button:hover{background:rgba(255,255,255,.35)}
.keys button:active{transform:scale(.92);background:#fff;color:var(--brand2)}
.lerr{min-height:24px;font-weight:700;color:#ffe3e3}
#modal{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(0,0,0,.55);padding:16px}
#modal.on{display:grid;animation:fadeUp .2s both}
.mbox{background:var(--surface);border-radius:20px;padding:20px;max-width:640px;width:100%;max-height:85vh;overflow:auto;animation:pop .3s both}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 22px;border-radius:999px;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .3s both;max-width:92vw;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:110}
#fx span{position:absolute;width:9px;height:9px;border-radius:50%;animation:burst .9s ease-out forwards}

/* ---------- SLIP (fixed light colours so it prints identically) ---------- */
.slip{--sf:15px;font-size:var(--sf);background:#fff;color:#111;border:2.5px solid #b8400a;border-radius:.9em;overflow:hidden;font-family:"Mukta","Noto Sans Devanagari","Mangal","Segoe UI",sans-serif;line-height:1.3;box-shadow:var(--shadow)}
.slip.anim{animation:pop .45s both}
.s-top{display:flex;gap:.7em;align-items:center;padding:.6em .8em;color:#fff;background:linear-gradient(120deg,#f59e0b,#e8590c 60%,#b8400a)}
.s-top img{width:3.6em;height:3.6em;object-fit:contain;background:#fff;border-radius:50%;padding:2px;flex:none}
.s-t1{font-size:1.2em;font-weight:800;line-height:1.15}
.s-t2{font-size:.82em;opacity:.95}
.s-rib{background:#1b7a3d;color:#fff;text-align:center;font-weight:800;letter-spacing:.06em;padding:.2em 0;font-size:.9em}
.s-body{padding:.6em .9em}
.s-name{font-size:1.5em;font-weight:800;text-align:center;line-height:1.2}
.s-name2{text-align:center;color:#555;margin-bottom:.4em}
.s-big{display:flex;gap:.7em;justify-content:center;margin:.4em 0}
.s-big div{border:2px solid #b8400a;border-radius:.6em;padding:.1em 1em;text-align:center;font-size:.8em;color:#b8400a;font-weight:700}
.s-big b{display:block;font-size:1.7em;color:#111;line-height:1.1}
.slip table{font-size:1em}
.slip td{padding:.22em .3em;border-bottom:1px dotted #bbb;color:#111}
.slip td:first-child{color:#666;width:46%}
.slip td:last-child{font-weight:700}
.s-msg{text-align:center;margin:.5em 0 .1em;font-weight:800;color:#b8400a}
.s-msg small{display:block;font-weight:500;color:#333;font-size:.85em}
.s-foot{display:flex;align-items:center;gap:.7em;border-top:2px dashed #b8400a;padding:.5em .8em;background:#fff8ef}
.s-foot img{width:3em;height:3em;border-radius:50%;object-fit:cover;border:2px solid #b8400a;flex:none}
.s-foot div{font-size:.85em;flex:1;line-height:1.2}
.s-foot b{display:block;font-size:1.05em}

#printArea{display:none}
@media print{
  @page{size:A4;margin:8mm}
  :root{padding:0!important}
  html,body{background:#fff!important;color:#000}
  body.pm>*:not(#printArea){display:none!important}
  body.pm #printArea{display:block}
  #printArea .slip{box-shadow:none;break-inside:avoid;page-break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pa-s2,.pa-s4,.pa-s6{display:grid!important;gap:5mm}
  .pa-s2{grid-template-columns:1fr;justify-items:center}
  .pa-s2 .slip{--sf:13.5px;width:135mm}
  .pa-s4{grid-template-columns:1fr 1fr}
  .pa-s4 .slip{--sf:11px}
  .pa-s6{grid-template-columns:1fr 1fr;gap:3mm}
  .pa-s6 .slip{--sf:8.6px}
  .pl-sec{page-break-after:always;break-after:page}
  .pl-sec:last-child{page-break-after:auto}

const IDB = {
  db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open("cp_voters_db",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>{IDB.db=r.result;res(true)}; r.onerror=()=>res(false); }catch(e){res(false)} }); },
  get(k){ return new Promise(res=>{ if(!IDB.db) return res(null); try{ const q=IDB.db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result??null); q.onerror=()=>res(null);}catch(e){res(null)} }); },
  set(k,v){ return new Promise(res=>{ if(!IDB.db) return res(false); try{ const tx=IDB.db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);}catch(e){res(false)} }); }
};

function resizeImage(file,max,type){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
      const sc=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas");
      c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      const x=c.getContext("2d"); if(type==="image/jpeg"){ x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); }
      x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL(type,.88)); };
      im.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

/* ---------- PIN ---------- */
async function hashPin(p){
  const s="cp|"+p;
  try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))>>>0; return "x"+h; }
}
async function loadPins(){
  S.pins = LS.get("cp_pins",null);
  if(!S.pins){ S.pins={staff:await hashPin("1234"),admin:await hashPin("9999"),sl:4,al:4,changed:false}; LS.set("cp_pins",S.pins); }
}

const norm = s => String(s||"").toLowerCase().normalize("NFC").replace(/\s+/g," ").trim();
const sk = s => norm(s).replace(/[aeiouyh\s.\-\/]/g,"").replace(/(.)\1+/g,"$1");
const surname = v => norm(v.name).split(" ")[0];
const surnameMr = v => norm(v.nameMr).split(" ")[0];
const famKey = v => v.family ? "f|"+norm(v.family) : (v.house ? "h|"+norm(v.house)+"|"+v.ward : null);
const familyOf = v => { const k=famKey(v); return k? S.voters.filter(x=>x.id!==v.id && famKey(x)===k):[]; };
function relativesOf(v,ex){
  const ids=new Set(ex.map(x=>x.id)); ids.add(v.id);
  return S.voters.filter(x=>!ids.has(x.id)&&x.ward===v.ward&&((surname(v)&&surname(x)===surname(v))||(surnameMr(v)&&surnameMr(x)===surnameMr(v)))).slice(0,8);
}
const dispName = v => S.lang==="mr"?(v.nameMr||v.name):(v.name||v.nameMr);
const altName = v => S.lang==="mr"?v.name:v.nameMr;
const gKey = v => (String(v.gender||"M").toUpperCase()[0]);
const genderLbl = v => ({M:t("male"),F:t("female")}[gKey(v)]||t("other"));
const wardList = () => [...new Set(S.voters.map(v=>v.ward).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
const hue = v => (String(v.ward).charCodeAt(0)*37 + (v.name||"").length*11)%360;
const initial = v => (dispName(v)||"?").trim().slice(0,1);
const fmtTime = iso => { try{ return new Date(iso).toLocaleTimeString(S.lang==="mr"?"mr-IN":"en-IN",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } };
function passFilter(v){
  const a=parseInt(v.age)||0;
  switch(S.filter){
    case "pending": return !v.voted; case "voted": return !!v.voted;
    case "senior": return a>=60; case "women": return gKey(v)==="F"; case "youth": return a>=18&&a<=25;
    default: return true;
  }
}
function doSearch(){
  const q=norm(S.q);
  const base=S.voters.filter(v=>(!S.ward||v.ward===S.ward)&&passFilter(v));
  if(!q && S.filter==="all") return {arr:[],active:false,fuzzy:false};
  if(!q) return {arr:base.sort((a,b)=>(+a.serial||0)-(+b.serial||0)),active:true,fuzzy:false};
  const words=q.split(" ");
  let arr=base.filter(v=>{ const h=norm(v.name+" "+v.nameMr+" "+v.voterId+" "+v.serial+" "+v.house); return words.every(w=>h.includes(w)); });
  let fuzzy=false;
  if(!arr.length){ const qs=words.map(sk).filter(Boolean); if(qs.length){ arr=base.filter(v=>{ const h=sk(v.name)+" "+norm(v.nameMr); return qs.every(w=>h.includes(w)); }); fuzzy=arr.length>0; } }
  arr.sort((a,b)=>{ const f=x=>(norm(x.name).startsWith(q)||norm(x.nameMr).startsWith(q)||norm(x.voterId)===q)?0:1; return f(a)-f(b)||(+a.serial||0)-(+b.serial||0); });
  return {arr,active:true,fuzzy};
}
function hl(text){
  const s=esc(text); const q=S.q.trim(); if(!q) return s;
  try{ const re=new RegExp("("+q.split(/\s+/).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi"); return s.replace(re,"<mark>$1</mark>"); }catch(e){ return s; }
}
function countUp(el){
  const to=+el.dataset.count||0, dur=900, st=performance.now();
  const dec=+el.dataset.dec||0;
  (function f(n){ const p=Math.min(1,(n-st)/dur), e=1-Math.pow(1-p,3); el.textContent=(to*e).toFixed(dec); if(p<1) requestAnimationFrame(f); else el.textContent=to.toFixed(dec); })(st);
}
function animateAll(){
  $$("[data-count]").forEach(countUp);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $$("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");
    $$("[data-h]").forEach(e=>e.style.height=e.dataset.h+"%");
    $$("[data-off]").forEach(e=>e.style.strokeDashoffset=e.dataset.off);
  }));
}
function burst(x,y){
  const fx=$("#fx"); const cols=["#e8730c","#f59e0b","#1b7a3d","#ffffff","#b8400a"];
  for(let i=0;i<22;i++){ const s=document.createElement("span"); const a=Math.random()*6.283, d=50+Math.random()*90;
    s.style.left=x+"px"; s.style.top=y+"px"; s.style.background=cols[i%cols.length];
    s.style.setProperty("--dx",Math.cos(a)*d+"px"); s.style.setProperty("--dy",Math.sin(a)*d-30+"px"); fx.appendChild(s); setTimeout(()=>s.remove(),950); }
}

function parseCSV(text){
  text=text.replace(/^\uFEFF/,"").replace(/\r/g,"");
  const first=text.split("\n")[0]||"";
  const d=first.includes("\t")?"\t":(first.split(";").length>first.split(",").length?";":",");
  const rows=[]; let cur=[],f="",q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===d){cur.push(f);f="";} else if(c==="\n"){cur.push(f);rows.push(cur);cur=[];f="";} else f+=c; }
  if(f||cur.length){cur.push(f);rows.push(cur);}
  return rows.filter(r=>r.some(x=>x.trim()));
}
const ALIAS={name:["name","name_en","english name","name (english)","voter name"],nameMr:["name_mr","marathi","marathi name","नाव","name (marathi)","नाव (मराठी)"],voterId:["voter_id","voterid","epic","voter id","id","मतदार ओळखपत्र"],ward:["ward","ward no","ward_no","वॉर्ड"],serial:["serial","sr","sr no","sr.no","serial no","अ.क्र.","अनुक्रमांक","sr_no"],age:["age","वय"],gender:["gender","sex","लिंग"],house:["house","address","house no","पत्ता","घर"],family:["family","family_id","family id","कुटुंब"],booth:["booth","polling booth","polling station","मतदान केंद्र"],phone:["phone","mobile","mobile no","मोबाईल"]};
function importRows(text,replace){
  const rows=parseCSV(text); if(rows.length<2){ toast("—"); return; }
  const hdr=rows[0].map(h=>h.trim().toLowerCase()), idx={};
  for(const k in ALIAS) idx[k]=hdr.findIndex(h=>ALIAS[k].includes(h));
  const out=[];
  rows.slice(1).forEach((r,i)=>{ const g=k=>idx[k]>=0?(r[idx[k]]||"").trim():""; const name=g("name"),nameMr=g("nameMr"); if(!(name||nameMr)) return;
    let gd=g("gender").toUpperCase(); gd=/^(F|S|स्)/.test(gd)||gd.startsWith("स्त्री")?"F":/^(M|P|पु)/.test(gd)?"M":(gd?"O":"M");
    out.push({id:"i"+Date.now().toString(36)+i,name:name||nameMr,nameMr:nameMr||name,voterId:g("voterId"),ward:g("ward"),serial:g("serial")||String(i+1),age:g("age"),gender:gd,house:g("house"),family:g("family"),booth:g("booth"),phone:g("phone"),voted:false,votedAt:null}); });
  if(replace) S.voters=out; else{ const m=new Map(S.voters.map(v=>[v.voterId,v])); out.forEach(v=>{ const ex=v.voterId&&m.get(v.voterId); if(ex) Object.assign(ex,v,{id:ex.id,voted:ex.voted,votedAt:ex.votedAt}); else S.voters.push(v); }); }
  persist(); toast(out.length+" "+t("imported")); render();
}

      if(!(rec.name||rec.nameMr)||!rec.voterId){ toast(t("needName")); break; }
      rec.name=rec.name||rec.nameMr; rec.nameMr=rec.nameMr||rec.name;
      const ex=S.editId?S.voters.find(x=>x.id===S.editId):S.voters.find(x=>x.voterId===rec.voterId);
      if(ex){ Object.assign(ex,rec); toast(t("updated")); } else { S.voters.push(Object.assign({id:"n"+Date.now().toString(36),voted:false,votedAt:null},rec)); toast(t("saved")); }
      S.editId=null; persist(); render(); break; }
    case "saveSettings":
      Object.keys(DEF).forEach(k=>{ if(k==="symbol"||k==="photo"||k==="autoLock"||k==="sarpanchPhoto") return; const i=$("#s_"+k); if(i) S.settings[k]=i.value.trim(); });
      saveSettings(); toast(t("saved")); render(); break;
    case "resetSym": S.settings.symbol=""; saveSettings(); render(); break;
    case "resetPhoto": S.settings.photo=""; saveSettings(); render(); break;
    case "resetSarpanch": S.settings.sarpanchPhoto=""; saveSettings(); render(); break;
    case "savePins": {
      const a=$("#p_staff").value.trim(), b=$("#p_admin").value.trim(), m=$("#p_lock").value.trim();
      if(m!=="") S.settings.autoLock=String(Math.max(0,+m||0));
      if((a&&!/^\d{4,6}$/.test(a))||(b&&!/^\d{4,6}$/.test(b))){ toast(t("pinBad")); break; }
      if(a){ S.pins.staff=await hashPin(a); S.pins.sl=a.length; }
      if(b){ S.pins.admin=await hashPin(b); S.pins.al=b.length; }
      if(a||b) S.pins.changed=true;
      LS.set("cp_pins",S.pins); saveSettings(); toast(t("saved")); render(); break; }
    case "importPaste": { const tx=$("#paste").value; if(tx.trim()) importRows(tx,$("#replace").checked); break; }
    case "template": saveFile("voters-template.csv","\uFEFF"+HEAD+"\n"+'"Shelar Ramesh Bhika","शेलार रमेश भिका","MH/26/101/000101","1","1","52","M","घर क्र. 12","F001","","9800000000"\n'); break;
    case "bkCsv": saveFile("chandanpuri-voters.csv","\uFEFF"+HEAD+"\n"+S.voters.map(x=>[x.name,x.nameMr,x.voterId,x.ward,x.serial,x.age,x.gender,x.house,x.family,x.booth,x.phone].map(csvCell).join(",")).join("\n")); break;
    case "bkJson": saveFile("chandanpuri-backup.json",JSON.stringify({voters:S.voters,settings:S.settings,at:new Date().toISOString()})); break;
    case "demo": S.voters=JSON.parse(JSON.stringify(DEMO)); persist(); render(); break;
    case "wipe": if(confirm(t("confirmWipe"))){ S.voters=[]; S.sel=null; persist(); render(); } break;
  }
});

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  applyTheme(); document.documentElement.lang=S.lang;
  await IDB.open();
  let v=await IDB.get("voters"); if(!v) v=LS.get("cp_voters_fb",null);
  if(!v){ v=JSON.parse(JSON.stringify(DEMO)); }
  S.voters=v;
  await loadPins();
  render();
})();
</script>
</body>
